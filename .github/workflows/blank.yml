name: Build APK - Final Clean Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clean broken duplicate files
        run: |
          rm -f settings_1.gradle
          rm -f app/build_1.gradle
          rm -f app/src/main/AndroidManifest_1.xml
          rm -f app/src/main/java/com/lighttv/mol4/*_1.kt
          rm -f app/src/main/res/layout/*_1.xml
          rm -f app/src/main/res/drawable/*_1.xml
          rm -f app/src/main/res/layout/activity_*_1.xml
          rm -f app/src/main/res/layout/fragment_*_1.xml
          rm -f app/src/main/res/layout/item_*_1.xml
          find . -name "*_1.*" -type f -delete || true
          echo "Nettoyage fait"

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightTV-APK-MiBoxS
          path: app/build/outputs/apk/debug/*.apk
