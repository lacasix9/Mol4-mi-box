name: Build APK - FIX SERIEUX FINAL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: REPARE LE PROJET CASSE (écrase les fichiers cassés)
        run: |
          echo "=== Suppression fichiers en double ==="
          rm -f settings_1.gradle app/build_1.gradle
          rm -rf gradle/ gradlew
          find app/src -name "*_1.*" -delete || true
          
          echo "=== Réécriture settings.gradle ==="
          echo "include ':app'" > settings.gradle
          
          echo "=== Réécriture build.gradle racine ==="
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          echo "=== Réécriture app/build.gradle minimal qui BUILD ==="
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lighttv.mol4'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lighttv.mol4"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0-Lion-MOL4"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          echo "=== Vérification ==="
          cat settings.gradle
          cat app/build.gradle | head -20

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK VERT
        uses: actions/upload-artifact@v4
        with:
          name: LightTV-MOL4-APK-MiBoxS-VERT
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
