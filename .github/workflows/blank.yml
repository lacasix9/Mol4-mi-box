name: Build APK - Fix Croix Rouge Final

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clean duplicate files that break build
        run: |
          rm -f settings_1.gradle
          rm -f app/build_1.gradle
          rm -f app/src/main/AndroidManifest_1.xml
          rm -f app/src/main/java/com/lighttv/mol4/*_1.kt
          rm -f app/src/main/res/layout/*_1.xml
          rm -f app/src/main/res/drawable/*_1.xml
          rm -f app/src/main/res/layout/fragment_*_1.xml
          rm -f app/src/main/res/layout/item_*_1.xml
          rm -f app/src/main/res/layout/activity_*_1.xml
          echo "Fichiers restants:"
          ls app/src/main/java/com/lighttv/mol4/ | head -20

      - name: Make gradlew executable
        run: chmod +x ./gradlew || echo "pas de gradlew, on utilisera gradle"

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightTV-APK-MiBoxS
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
