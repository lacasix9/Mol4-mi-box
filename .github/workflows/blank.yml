name: Build APK - VERT FINAL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Clean project (supprime fichiers cassés)
        run: |
          rm -f settings_1.gradle
          rm -f app/build_1.gradle
          rm -f gradlew
          rm -rf gradle/
          find app/src -name "*_1.*" -delete || true
          ls -R app/src/main/java | head -20

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightTV-APK-MiBoxS-VERT
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
